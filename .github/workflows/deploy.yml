name: Deploy Next.js via FTP

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: globalinfotechindia.com
          username: globalinfotechin_taskmanagement_system
          password: culu&Zb8D
          port: 21
          local-dir: ./dist/
          server-dir: /taskmanagementsystem_globalinfotechindia_com/
